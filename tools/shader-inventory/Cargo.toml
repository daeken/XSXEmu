[package]
name = "xsx-shader-inventory"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
default-run = "xsx-shader-inventory"

[dependencies]
xsxemu = { path = "../.." }
flate2 = "1.1"
libloading = "0.8.9"
sha2 = { version = "0.10", optional = true }

[features]
metal-probe = ["dep:metal", "dep:sha2"]
bake-planner = ["dep:sha2"]

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.33", optional = true }

[[bin]]
name = "shader-metal-probe"
path = "src/metal_probe.rs"
required-features = ["metal-probe"]

[[bin]]
name = "shader-metal-render-probe"
path = "src/metal_render_probe.rs"
required-features = ["metal-probe"]

[[bin]]
name = "shader-metal-mesh-probe"
path = "src/metal_mesh_probe.rs"
required-features = ["metal-probe"]

[[bin]]
name = "shader-bake-plan"
path = "src/bake_plan.rs"
required-features = ["bake-planner"]

[[bin]]
name = "shader-metal-graphics-lift"
path = "src/metal_graphics_lift.rs"
required-features = ["metal-probe"]
