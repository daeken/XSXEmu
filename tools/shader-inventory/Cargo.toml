[package]
name = "xsx-shader-inventory"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
default-run = "xsx-shader-inventory"

[dependencies]
xsxemu = { path = "../.." }
flate2 = "1.1"
libloading = "0.8.9"

[features]
metal-probe = ["dep:metal"]

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.33", optional = true }

[[bin]]
name = "shader-metal-probe"
path = "src/metal_probe.rs"
required-features = ["metal-probe"]
